<h1>Résultats Nuits</h1>

<p>Application permettant de générer un PDF sur un patient :</p>

<button class="btn-application" (click)="ouvrirAppli()">
  Ouvrir l'application
</button>

<br><br>
<label>Choisissez une nuit</label>
<br>
<select
  (focus)="listerNuitsNonTraitees()"
  [(ngModel)]="inputIdNuit">

  <option value="">Choisir l'identifiant de la nuit</option>

  @for (nuit_etude of NuitsNontraitees(); track nuit_etude.id_nuit) {
    <option [value]="nuit_etude.id_nuit">
      {{ nuit_etude.id_nuit }}
    </option>
  }
</select>

<br><br>
<label>Choisissez un medecin </label>
<br>
<select
  (focus)="listerMedecins()"
  [(ngModel)]="inputIdMedecin">

  <option value="">Choisir le médecin validateur</option>

  @for (medecin of medecins(); track medecin.id) {
    <option [value]="medecin.id_personnel">
      {{ medecin.nom }} {{ medecin.prenom }} - {{ medecin.specialite }}
    </option>
  }
</select>

<br><br>

<div class="commentaire-container">
  <label for="commentaire">Ajouter un Commentaire :</label>

  <textarea
    id="commentaire"
    [(ngModel)]="commentaire"
    rows="5"
    placeholder="Saisissez votre commentaire...">
  </textarea>
</div>

<br>

<button
  class="btn-envoyer"
  (click)="lancerEtl(inputIdNuit, inputIdMedecin, commentaire)">
  Envoyer
</button>
<div class="message-resultat">
  <p>{{ result()?.message  }}</p> 
</div>
