<h1> Résultats Nuits </h1>

<p>Contenu de la page Résultats Nuits .</p>

<select name="" id="" (click)="listerMedecins()">
    <option> Choisir le médecin validateur </option>
     @for (medecin of medecins(); track medecin.id) {
    <option> {{ medecin.nom}} {{ medecin.prenom }} - {{medecin.specialite }} </option>}
</select>
<div class="commentaire-container">
  <label for="commentaire">Commentaire :</label>

  <textarea
    id="commentaire"
    [(ngModel)]="commentaire"
    rows="5"
    placeholder="Saisissez votre commentaire...">
  </textarea>
  <button>Envoyer</button>
</div>
