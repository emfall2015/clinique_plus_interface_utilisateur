<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            CliniquePlus
        </div>

        <nav>

            <a routerLink="/layout/dashboard" routerLinkActive="active">
                <span class="material-icons">dashboard</span> Dashboard
            </a>

            <a routerLink="/layout/resultats-nuits" routerLinkActive="active">
                <span class="material-icons">assignment</span> Résultats nuits
            </a>

            <a routerLink="/layout/patients" routerLinkActive="active">
                <span class="material-icons">groups</span> Patients
            </a>
            <a routerLink="" routerLinkActive="active">
                <span class="material-icons">logout</span> Déconnexion
            </a>
        </nav>
    </aside>

    <main class="content">

        <header class="topbar">

            <div></div>

            <div class="user">

                <span>

                    {{ userService.recupererUser()?.nom }}
                    {{ userService.recupererUser()?.prenom }}
                </span>

                <div class="avatar">
                    {{ userService.recupererUser()?.prenom.charAt(0).toUpperCase() }}
                </div>

            </div>

        </header>

        <router-outlet></router-outlet>

    </main>

</div>
